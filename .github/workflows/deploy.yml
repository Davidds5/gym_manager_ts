name: CI Gym Manger

on: 
  push: 
    branches: [ main ]
  pull_request: 
    branches: [ main ]

env: 
  NODE_VERDSION: '20'


jobs: 
  testes: 
    name: 'Executar Testes Unitarios'
    runs-on: ubuntu-latest

    steps: 
      - name: Baixa codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERDSION}}
          cache: 'npm'

      - name:  Instalar dependencias
        run: npm ci 

      - name: Gera Prisma
        run: npx prisma generate

      - name: Rodar Vitest
        run: npm run test


    sucesso: 
      name: 'Validacao Concluida'
      needs: testes
      runs-on: ubuntu-latest

      steps: 
        - name: Exibir Dados do Contexto
          run: |
            echo "✅ Pipeline executada com sucesso!"
            echo "📦 Repositorio: ${{ github.repository }}"
            echo "👤 Autor do commit: ${{ github.actor }}"
            echo "🌿 Branch: ${{ github.ref_name }}"