name: CI Gym Manager

on: 
  push: 
    branches: [ main ]
  pull_request: 
    branches: [ main ]

env: 
  NODE_VERSION: '20'
  DATABASE_URL: 'postgresql://fake:fake@localhost:5432/gym_test'
  

jobs: 
  testes: 
    name: 'Executar Testes Unitarios'
    runs-on: ubuntu-latest

    steps: 
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci 

      - name: Gerar Prisma
        run: npx prisma generate

      - name: Rodar Vitest
        run: npm run test

  sucesso: 
    name: 'Validacao Concluida'
    needs: testes
    runs-on: ubuntu-latest

    steps: 
      - name: Exibir Dados do Contexto
        run: |
          echo "✅ Pipeline executada com sucesso!"
          echo "📦 Repositorio: ${{ github.repository }}"
          echo "👤 Autor do commit: ${{ github.actor }}"
          echo "🌿 Branch: ${{ github.ref_name }}"

      - name: Testando segredo
        env: 
          TOKEN: ${{ secrets.CHAVE_SECRETA }}
        run: |
          echo "O segredo foi injetado com sucesso!"
          echo "Valor mascarado: $TOKEN"
